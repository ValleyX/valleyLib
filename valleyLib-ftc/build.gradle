plugins {
    id 'com.android.library'
    id 'maven-publish'
}

group = 'com.vcs.valleylib'
version = '1.0.7'

android {
    namespace 'org.vcs.valleylib.ftc'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }

    testOptions {
        // JUnit 5 tests are silently skipped without the platform runner.
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

dependencies {
    implementation project(':valleyLib-core')
    implementation libs.annotation.jvm

    compileOnly libs.robotcore
    compileOnly libs.hardware
    compileOnly libs.robotserver

    api libs.fullpanels
    api libs.ftc
    api libs.telemetry

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'ftc'
            }
        }
    }
}
